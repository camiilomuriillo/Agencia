<title>Brújula Vocacional</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo cuaderno de orientación; el test avanza por secciones y el resultado se abre en pestañas ordenadas por fases. */
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --surface-2:#E6EEEA; --ink:#13302A; --muted:#536E67; --line:#D0DCD7;
  --accent:#1B7360; --accent-ink:#FFFFFF; --accent-soft:#D4EAE2; --sun:#A86E0C; --sun-soft:#F5E6C6; --warn:#9F432C; --warn-soft:#F5DED6;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1613; --surface:#14201C; --surface-2:#1B2A25; --ink:#E2EDE8; --muted:#93AAA3; --line:#283A34;
  --accent:#4BC2A0; --accent-ink:#06201A; --accent-soft:#18372E; --sun:#E3AC4B; --sun-soft:#382D17; --warn:#E68D74; --warn-soft:#3A221C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#14201C; --surface-2:#1B2A25; --ink:#E2EDE8; --muted:#93AAA3; --line:#283A34;
  --accent:#4BC2A0; --accent-ink:#06201A; --accent-soft:#18372E; --sun:#E3AC4B; --sun-soft:#382D17; --warn:#E68D74; --warn-soft:#3A221C; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,6vw,3.2rem);font-weight:800}
h2{font-size:clamp(1.45rem,3.6vw,1.9rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 20px;border-radius:999px;font-weight:700;font-size:1rem}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-block:12px 8px}
.hero .lead{font-size:1.15rem;max-width:56ch;color:var(--muted)}
.compass{width:150px;height:150px}
@media (max-width:620px){.hero{grid-template-columns:1fr}.compass{width:110px;height:110px;order:-1}}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.phases li{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;min-width:0}
.phases .n{font-family:var(--font-display);font-weight:800;color:var(--accent);font-size:1.3rem;line-height:1}
.note{background:var(--sun-soft);border-radius:var(--radius);padding:14px 16px;font-size:.95rem}
.note.warn{background:var(--warn-soft)}
.note.ok{background:var(--accent-soft)}

/* Progreso */
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.progress span{height:6px;border-radius:3px;background:var(--surface-2)}
.progress span.done{background:var(--accent)}
.progress span.now{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-2) 50%)}
.progress-label{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);gap:8px;flex-wrap:wrap}

/* Preguntas */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px}
.q legend,.q .qt{font-family:var(--font-display);font-weight:700;font-size:1.12rem;line-height:1.3;padding:0}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.q .hint{font-size:.9rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.35;display:flex;gap:10px;align-items:flex-start}
.opt::before{content:"";flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"]::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600}
textarea,input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus{border-color:var(--accent);outline:none}
.navbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.missing{color:var(--warn);font-weight:600;font-size:.95rem}

/* Resultados */
.banner{background:var(--sun-soft);border-radius:var(--radius);padding:12px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;font-size:.95rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:8px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.95rem;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start;min-width:0}
.tag{flex:0 0 auto;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;margin-top:3px}
.tag.hecho{background:var(--accent-soft);color:var(--accent)}
.tag.hipo{background:var(--sun-soft);color:var(--sun)}
.tag.explorar{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.hexwrap{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:20px;align-items:center}
@media (max-width:640px){.hexwrap{grid-template-columns:1fr}}
.hexwrap svg{width:100%;max-width:300px;height:auto;justify-self:center}
.traits{display:flex;flex-direction:column;gap:12px}

details.path{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
details.path[open]{border-color:var(--accent)}
details.path summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
details.path summary::-webkit-details-marker{display:none}
.rank{font-family:var(--font-display);font-weight:800;font-size:1.5rem;color:var(--muted);width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.ptitle{display:flex;flex-direction:column;gap:4px;min-width:0}
.pill{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);width:fit-content}
.pill.ia{background:var(--accent-soft);color:var(--accent)}
.score{font-family:var(--font-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--accent);text-align:right;line-height:1}
.score small{font-size:.8rem;color:var(--muted);font-weight:600}
.pbody{padding:0 18px 20px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 22px}
.fact h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:3px;font-family:var(--font-body)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:170px 1fr 2.4ch;gap:10px;align-items:center;font-size:.92rem}
.bar .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.bar .why{grid-column:1/-1;color:var(--muted);font-size:.86rem;margin-top:-4px}
@media (max-width:520px){.bar{grid-template-columns:1fr 2.4ch}.bar .track{grid-column:1/-1;grid-row:2}}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
tr:last-child td{border-bottom:0}

.timeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.timeline .card h3 span{color:var(--accent)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:600}
.calc label span{font-weight:400;color:var(--muted);font-size:.82rem}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.out div{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.out b{display:block;font-family:var(--font-display);font-size:1.45rem;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px;accent-color:var(--accent);width:18px;height:18px;flex:0 0 auto}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.ai{border:1.5px dashed var(--accent)}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.fallback{width:100%;min-height:160px;font-family:ui-monospace,monospace;font-size:.85rem}
footer{margin-top:40px;font-size:.85rem;color:var(--muted)}
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* ================= DATOS ================= */
const RIA = ['R','I','A','S','E','C'];
const RIA_INFO = {
  R:{n:'Lado práctico', d:'Disfrutas trabajando con las manos, con herramientas o con cosas tangibles, y viendo un resultado concreto.', env:'oficios, mantenimiento, talleres, trabajo de campo', no:'puestos de oficina sin nada tangible que hacer'},
  I:{n:'Lado curioso', d:'Te atrae entender cómo funcionan las cosas, investigar y resolver problemas difíciles.', env:'técnica, calidad, análisis, tecnología', no:'tareas mecánicas donde no hay nada que pensar'},
  A:{n:'Lado creativo', d:'Necesitas poner algo tuyo: estética, ideas, sabor, imagen, estilo.', env:'diseño, cocina, contenido, artesanía', no:'entornos rígidos donde todo viene dictado'},
  S:{n:'Lado de ayuda', d:'Te llena que otras personas estén mejor gracias a ti: escuchar, cuidar, enseñar.', env:'cuidados, enseñanza, bienestar, atención', no:'trabajos aislados sin trato humano'},
  E:{n:'Lado emprendedor', d:'Te mueve decidir, convencer, negociar y hacer crecer proyectos.', env:'ventas, negocio propio, coordinación de equipos', no:'puestos sin margen para decidir nada'},
  C:{n:'Lado organizador', d:'Disfrutas del orden, los procesos claros y de que todo cuadre.', env:'administración, gestión, calidad, logística', no:'entornos caóticos sin estructura'}
};
const AREAS = [
  ['cuidado','Cuidar de personas',{S:1}],['salud','Salud y bienestar',{S:1,I:1}],['cocina','Cocina y comida',{A:1,R:1}],
  ['belleza','Belleza y peluquería',{A:1,S:1}],['moda','Moda y costura',{A:1}],['artesania','Manualidades y artesanía',{A:1,R:1}],
  ['reparar','Reparar y construir',{R:2}],['tecnologia','Tecnología e informática',{I:1,R:1}],['redes','Redes sociales',{A:1,E:1}],
  ['diseno','Diseño, dibujo y arte',{A:2}],['numeros','Números y dinero',{C:1,I:1}],['orden','Orden y organización',{C:2}],
  ['ensenar','Enseñar y explicar',{S:2}],['animales','Animales',{S:1,R:1}],['plantas','Plantas y naturaleza',{R:1}],
  ['deporte','Deporte y movimiento',{R:1,S:1}],['ventas','Vender y negociar',{E:2}],['hogar','Casa y decoración',{A:1,C:1}],
  ['foto','Fotografía y vídeo',{A:2}],['escribir','Escribir y leer',{A:1,I:1}],['idiomas','Idiomas y culturas',{S:1,I:1}],
  ['motor','Coches y motor',{R:2}],['energia','Energía y sostenibilidad',{I:1,R:1}],['segunda','Segunda mano y chollos',{E:1}]
];
const AREA_N = Object.fromEntries(AREAS.map(a=>[a[0],a[1]]));
const AYUDA = [
  ['arreglar','Arreglar cosas que se estropean',['reparar','motor'],{R:1},'Resolver averías y problemas prácticos'],
  ['consejos','Escuchar y dar consejo',['cuidado'],{S:1},'Escucha y empatía'],
  ['organizar','Organizar planes, viajes o eventos',['orden'],{C:1,E:1},'Planificar y coordinar'],
  ['tecno','Problemas con el móvil o el ordenador',['tecnologia'],{I:1},'Soltura con la tecnología'],
  ['cocinar','Cocinar o preparar comida',['cocina'],{A:1},'Cocina y cuidado del detalle'],
  ['papeles','Papeles, trámites o cuentas',['numeros','orden'],{C:1},'Gestionar papeles y números'],
  ['look','Ropa, look o decoración',['moda','hogar','belleza'],{A:1},'Ojo estético'],
  ['cuidar','Cuidar niños, mayores o animales',['cuidado','animales'],{S:1},'Responsabilidad y paciencia al cuidar'],
  ['explicar','Explicar o enseñar algo',['ensenar'],{S:1},'Explicar de forma que se entienda'],
  ['vender','Vender, regatear o negociar',['ventas','segunda'],{E:1},'Persuadir y negociar'],
  ['escribir','Escribir textos, mensajes o currículums',['escribir'],{A:1},'Expresión escrita'],
  ['fotos','Hacer fotos o llevar redes',['foto','redes'],{A:1},'Sentido visual y manejo de redes'],
  ['pelo','Peinar, maquillar o arreglar uñas',['belleza'],{A:1,S:1},'Habilidad manual fina y estética']
];

const SECTIONS = [
 {id:'forma', t:'Tu forma de ser', intro:'No hay respuestas buenas ni malas. Elige lo que harías de verdad, no lo que te gustaría hacer.', qs:[
  {id:'sabado', type:'single', t:'Un sábado libre y sin planes. ¿Qué es más probable que acabes haciendo?', o:[
    ['R','Arreglar, montar o mejorar algo con las manos',{R:3}],['I','Investigar a fondo algo que te intriga',{I:3}],
    ['A','Crear algo: cocinar, decorar, dibujar, grabar un vídeo',{A:3}],['S','Quedar con gente o echar una mano a alguien',{S:3,soc:1}],
    ['E','Mover un plan: organizar una salida, vender algo, montar un proyecto',{E:3}],['C','Poner orden: la casa, las cuentas, la semana',{C:3}]]},
  {id:'energia', type:'single', t:'Después de un día con mucha gente alrededor, ¿cómo te quedas?', o:[
    ['alta','Con más energía. Me gusta estar entre gente',{soc:2,S:1,E:1}],['media','Bien, pero luego necesito un rato a mi aire',{soc:0}],
    ['baja','Con la batería baja. Necesito silencio para recuperarme',{soc:-2}]]},
  {id:'grupo', type:'single', t:'Cuando trabajas en grupo, ¿qué papel acabas teniendo casi sin querer?', o:[
    ['E','Tomo decisiones y tiro del grupo',{E:3}],['C','Reparto tareas y llevo el control',{C:2,E:1}],['A','Propongo ideas nuevas',{A:2,I:1}],
    ['S','Me fijo en que todo el mundo esté bien',{S:3}],['R','Me pongo con la parte práctica',{R:3}],['solo','Rindo más si me dejan a mi aire',{solo:2}]]},
  {id:'riesgo', type:'single', t:'Te proponen algo que puede salir muy bien o quedarse en nada. ¿Qué te sale?', o:[
    ['3','Ilusión. Lo pruebo y ya veré',{risk:3,E:1}],['2','Lo pruebo si no me juego lo que no puedo perder',{risk:2}],['1','Me agobia. Prefiero lo seguro aunque sea menos',{risk:1}]]},
  {id:'cansa', type:'multi', max:2, opt:true, t:'¿Qué te desgasta más en un trabajo?', hint:'Elige hasta 2.', o:[
    ['var','Hacer siempre lo mismo',{vari:1}],['struct','Improvisar sin saber qué toca',{struct:1,C:1}],['people','Tratar con gente difícil',{noPeople:1}],
    ['screen','Pasar horas delante de una pantalla',{noScreen:1}],['phys','El esfuerzo físico',{noPhys:1}],['orders','Que me den órdenes todo el rato',{auto:1,E:1}]]},
  {id:'orgullo', type:'single', t:'¿Qué te haría sentir más orgullo al acabar el día?', o:[
    ['I','Haber resuelto un problema que nadie sabía resolver',{I:3}],['S','Que alguien esté mejor gracias a mí',{S:3}],
    ['A','Haber hecho algo bonito con mi sello',{A:3}],['E','Ver crecer algo que es mío',{E:3}],
    ['C','Que todo haya salido en orden y sin errores',{C:3}],['R','Tener delante algo que funciona y que he hecho yo',{R:3}]]}
 ]},
 {id:'mueve', t:'Lo que te mueve', intro:'Marca lo que te gusta de verdad, aunque no lo veas como un trabajo. Que algo te guste no significa que tengas que convertirlo en negocio.', qs:[
  {id:'intereses', type:'multi', max:6, t:'¿Qué temas te gustan o te dan curiosidad?', hint:'Elige entre 1 y 6.', o:AREAS.map(a=>[a[0],a[1],Object.assign({area:a[0]},a[2])])},
  {id:'gratis', type:'text', opt:true, t:'¿Qué harías aunque nadie te pagara?', hint:'Con tus palabras. Una escena concreta vale más que una idea general.'},
  {id:'sueno', type:'text', opt:true, t:'¿Hay algo que te gustaba o soñabas hacer y fuiste dejando?', hint:'Opcional.'}
 ]},
 {id:'talentos', t:'Lo que se te da bien', intro:'A menudo lo que hacemos con facilidad nos parece normal. Para otras personas puede valer dinero.', qs:[
  {id:'ayuda', type:'multi', max:4, t:'¿Para qué te suele pedir ayuda la gente de tu alrededor?', hint:'Elige hasta 4.', o:AYUDA.map(a=>[a[0],a[1],Object.assign({ayuda:a[0]},a[3])])},
  {id:'aprende', type:'single', t:'¿Cómo aprendes mejor algo nuevo?', o:[
    ['practica','Haciéndolo con las manos, probando',{R:1,learn:'practica'}],['video','Con vídeos y tutoriales',{learn:'video'}],
    ['leer','Leyendo y tomando notas',{I:1,C:1,learn:'leer'}],['persona','Con alguien que me enseñe al lado',{S:1,learn:'persona'}]]},
  {id:'experiencia', type:'text', opt:true, t:'¿Qué has vivido o superado que podría servir a otras personas?', hint:'Opcional. Por ejemplo: cuidar de un familiar, cambiar de país, salir de una deuda, aprender un oficio de cero.'}
 ]},
 {id:'vida', t:'La vida que quieres', intro:'Piensa en dentro de dos o tres años, no en lo que tienes hoy.', qs:[
  {id:'horas', type:'single', t:'¿Cuántas horas a la semana te gustaría trabajar?', o:[

        else if(k==='area') areas.add(e[k]); else if(k==='ayuda') ayuda.add(e[k]); else if(k==='place') places.add(e[k]);
        else if(['risk','wantFlex','stab','hours','budget','dig','cush'].includes(k)) t[k]=e[k];
        else if(typeof e[k]==='string') t[k]=e[k]; else t[k]=(t[k]||0)+e[k]; } } }
  const allAreas=new Set(areas); for(const a of ayuda){ const d=AYUDA.find(x=>x[0]===a); d&&d[2].forEach(z=>allAreas.add(z)); }
  return {r,t,areas,ayuda,places,allAreas};
}
function sortedRia(r){ return RIA.slice().sort((a,b)=>r[b]-r[a]); }

function scorePath(p,P){
  const {r,t,allAreas,places}=P, why={};
  // personalidad
  const dot=RIA.reduce((s,k)=>s+r[k]*p.r[k],0), nu=Math.hypot(...RIA.map(k=>r[k]))||1, np=Math.hypot(...RIA.map(k=>p.r[k]))||1;
  const cos=dot/(nu*np); let pers=1+9*Math.min(1,Math.max(0,(cos-0.35)/0.55)); const pw=[];
  const topP=RIA.filter(k=>p.r[k]>=2), topU=sortedRia(r).slice(0,2);
  const shared=topU.filter(k=>topP.includes(k)); if(shared.length) pw.push('Pide tu '+shared.map(k=>RIA_INFO[k].n.toLowerCase()).join(' y tu '));
  else pw.push('Tira de rasgos que no son los más fuertes en ti');
  if(p.contact>=4&&t.soc<=-1){pers-=1.5;pw.push('mucho trato con gente, y tú necesitas recargar a solas');}
  if(p.contact>=4&&t.noPeople){pers-=1.5;pw.push('hay que lidiar con clientes difíciles');}
  if(p.contact<=2&&t.soc>=2){pers-=1;pw.push('poco contacto humano para alguien que se carga con la gente');}
  if(p.digital>=3&&t.noScreen){pers-=2;pw.push('muchas horas de pantalla');}
  if(p.phys>=4&&t.noPhys){pers-=2.5;pw.push('exige esfuerzo físico');}
  if(p.contact>=4&&t.solo){pers-=1;pw.push('se trabaja de cara a la gente y tú rindes más a tu aire');}
  if(t.auto&&p.tipo==='Empleo'){pers-=0.8;pw.push('sigue habiendo jefes y órdenes');}
  if(t.vari&&p.flex<=2){pers-=0.5;pw.push('puede ser rutinario');}
  why.pers=pw.join('; ')+'.';
  // afinidad
  const m=p.areas.filter(a=>allAreas.has(a)); const aff=[2,6,8,10][Math.min(3,m.length)];
  why.aff=m.length?'Conecta con lo que te gusta o te piden: '+m.map(a=>AREA_N[a].toLowerCase()).join(', ')+'.':'No coincide con los temas que marcaste.';
  // entrada
  let entry=p.entry*2; const ew=[];
  if(p.digital>t.dig+1){entry-=3;ew.push('pide bastante más soltura digital de la que tienes ahora');} else if(p.digital>t.dig){entry-=1;ew.push('tendrás que ganar algo de soltura digital');}
  if(p.hoursMin>t.hours){entry-=2;ew.push('necesita más horas semanales de las que tienes libres');}
  if(p.car&&!(t.car&&t.veh)){entry-=t.car?1:3;ew.push(t.car?'conviene tener vehículo':'necesitas carnet y vehículo');}
  if(p.fab&&t.fab){entry+=1;ew.push('tu experiencia en producción te da ventaja');}
  if(!ew.length) ew.push(['','Barrera alta: requiere formación reglada o experiencia','Barrera media-alta','Barrera media: formación práctica asequible','Barrera baja: se empieza con poco','Barrera muy baja'][p.entry]);
  why.entry=ew.join('; ')+'.';
  // inversión
  const cap=[0,1,2,3,5][t.budget]; let inv=11-p.inv*2;
  why.inv=['','Casi sin inversión','Inversión pequeña','Inversión moderada','Inversión considerable','Inversión alta'][p.inv]+'. '+p.coste;
  if(p.inv>cap){inv=Math.min(inv,3);why.inv+=' Supera lo que hoy puedes invertir.';}
  const flex=p.flex*2; why.flex=p.libertad;
  const growth=p.growth*2; why.growth=p.crecer;
  const cl=x=>Math.max(1,Math.min(10,Math.round(x)));
  const sc={aff:cl(aff),pers:cl(pers),entry:cl(entry),inv:cl(inv),flex:cl(flex),growth:cl(growth)};
  const wf=0.1+0.05*t.wantFlex;
  let total=(sc.aff*.25+sc.pers*.25+sc.entry*.15+sc.inv*.1+sc.flex*wf+sc.growth*.15)/(.9+wf);
  if(t.pref==='empleo'&&(p.tipo==='Empleo'||p.tipo==='Oficio')) total+=.6;
  if(t.pref==='negocio'&&p.tipo!=='Empleo') total+=.4;
  if(t.pref==='mixto'&&p.entry>=4&&p.inv<=2) total+=.4;
  if(t.stab===3&&p.tipo==='Empleo') total+=.5;
  if(t.risk===1&&p.inv>=3) total-=.5;
  if(p.places.some(x=>places.has(x))) total+=.3;
  if(t.care&&p.flex<=2) total-=.4;
  return {p,sc,why,total:Math.min(10,total)};
}
function ranking(P){ return PATHS.map(p=>scorePath(p,P)).sort((a,b)=>b.total-a.total); }
function finalists(rank){ const out=[],count={}; for(const x of rank){ if((count[x.p.tipo]||0)>=2) continue; out.push(x); count[x.p.tipo]=(count[x.p.tipo]||0)+1; if(out.length===3) break; } return out; }

function profile(P){
  const {r,t,areas,ayuda,places}=P, top=sortedRia(r), A=S.answers;
  const H=[],Y=[],X=[];
  // hechos: lo que dijo
  const qtxt=(id)=>{ for(const s of SECTIONS){const q=s.qs.find(q=>q.id===id); if(q){const v=A[id]; const o=q.o?.find(o=>o[0]===v); return o?o[1]:null;}} };
  if(qtxt('sabado')) H.push('En tu tiempo libre tiendes a: '+qtxt('sabado').toLowerCase()+'.');
  if(qtxt('orgullo')) H.push('Lo que más orgullo te daría: '+qtxt('orgullo').toLowerCase()+'.');
  if(qtxt('energia')) H.push('Con mucha gente alrededor: '+qtxt('energia').toLowerCase()+'.');
  if(qtxt('camino')) H.push('Ahora mismo te atrae: '+qtxt('camino').toLowerCase()+'.');
  // hipótesis
  Y.push(RIA_INFO[top[0]].n+' muy presente: '+RIA_INFO[top[0]].d.charAt(0).toLowerCase()+RIA_INFO[top[0]].d.slice(1));
  if(r[top[1]]>0) Y.push('Le sigue tu '+RIA_INFO[top[1]].n.toLowerCase()+': '+RIA_INFO[top[1]].d.charAt(0).toLowerCase()+RIA_INFO[top[1]].d.slice(1));
  Y.push(t.soc>=2?'Pareces ganar energía con la gente: los trabajos de cara al público pueden sumarte.':t.soc<=-1?'Pareces necesitar tiempo a solas para recargar: conviene que el trato con clientes sea dosificado.':'Te manejas bien con gente, pero necesitas tus ratos: un equilibrio entre trato y trabajo tranquilo.');
  Y.push(t.risk===3?'Toleras bien la incertidumbre: puedes probar cosas nuevas sin bloquearte. Ojo con lanzarte sin números.':t.risk===1?'Te da seguridad lo estable: tu cambio debería ir por pasos pequeños y con red.':'Arriesgas con cabeza: pruebas cosas si no comprometes lo básico.');
  if(t.solo) Y.push('Rindes mejor con autonomía que en equipos muy encima.');
  if(t.auto) Y.push('Te pesa la falta de autonomía: es una motivación fuerte para buscar algo propio o con más margen.');
  // explorar
  X.push('Si de verdad disfrutas haciendo estas actividades varias semanas seguidas, o solo te atrae la idea.');
  X.push('Cuánto dinero necesitas exactamente al mes. La calculadora de la pestaña 5 te ayuda.');
  if(!A.gratis) X.push('Qué harías aunque no te pagaran: dejaste esa pregunta en blanco y suele dar pistas valiosas.');
  if(r[top[0]]-r[top[2]]<2) X.push('Tus rasgos están bastante repartidos: puede ser una ventaja (versatilidad) o señal de que aún no has probado lo suficiente.');

  const motiv={I:'Resolver lo difícil y entender cómo funcionan las cosas',S:'Que otras personas estén mejor gracias a ti',A:'Expresarte y dejar tu sello',E:'Construir algo propio que crezca',C:'Hacer las cosas bien, con orden y sin errores',R:'Ver un resultado tangible hecho con tus manos'};
  const mot=[]; if(A.orgullo) mot.push(motiv[A.orgullo]); if(t.auto) mot.push('Ganar autonomía sobre tu tiempo y tus decisiones'); if(t.wantFlex>=1) mot.push('Trabajar menos horas o con horarios más tuyos'); if(t.stab===3) mot.push('Tener seguridad económica mes a mes');
  const forts=[...ayuda].map(a=>AYUDA.find(x=>x[0]===a)[4]); if(t.fab) forts.push('Disciplina, ritmo y cumplimiento de procesos, por tu experiencia en producción (hipótesis)'); if(t.fp) forts.push('Ya tienes formación profesional que puede abrirte puertas');
  const dev=[]; const third=top[2]; dev.push('Tu '+RIA_INFO[top[1]].n.toLowerCase()+' podría crecer con práctica en '+RIA_INFO[top[1]].env+'.');
  if(t.learn==='video') dev.push('Aprendes bien con vídeos: puedes formarte gratis en muchas habilidades.');
  if(t.learn==='practica') dev.push('Aprendes haciendo: prioriza formaciones con prácticas reales.');
  if(t.learn==='persona') dev.push('Aprendes al lado de alguien: busca mentores, prácticas o acompañar a profesionales.');
  if(t.learn==='leer') dev.push('Aprendes leyendo: puedes avanzar mucho con buenos manuales y cursos escritos.');
  if(t.dig<3) dev.push('Ganar soltura digital y con IA multiplicaría tus opciones, sea cual sea el camino.');
  const obs=[]; if(t.hours<=1) obs.push('Muy poco tiempo libre: necesitarás pruebas pequeñas o liberar horas.');
  if(t.cush===0) obs.push('Sin colchón de ahorro: no es momento de dejar el empleo; primero construir ahorro.');
  else if(t.cush===1) obs.push('Colchón pequeño: cualquier cambio debe hacerse sin soltar el sueldo.');
  if(t.budget===1) obs.push('Poco dinero para invertir: mejor caminos que se empiezan con tiempo, no con dinero.');
  if(t.dig===1) obs.push('Nivel digital básico: limita algunos caminos online, aunque se aprende.');
  if(t.care) obs.push('Cargas familiares: los horarios rígidos o de tarde te encajarán peor.');
  if(t.risk===1) obs.push('El miedo a la incertidumbre puede frenarte: los experimentos pequeños ayudan a perderle miedo.');
  if(!obs.length) obs.push('No marcaste grandes limitaciones. Aun así, conviene probar antes de cambiar.');
  const placeN={home:'en casa',field:'en casa de clientes o en la calle',local:'en un taller o local propio',company:'en una empresa con equipo',remote:'en remoto'};
  const env=[RIA_INFO[top[0]].env, RIA_INFO[top[1]].env].join('; '); const envPl=[...places].map(p=>placeN[p]);
  const no=[RIA_INFO[sortedRia(r)[5]].no]; if(t.noPhys) no.push('trabajos de mucho esfuerzo físico'); if(t.noScreen) no.push('trabajos de pantalla todo el día'); if(t.noPeople) no.push('atención al público con clientes difíciles'); if(t.vari) no.push('puestos muy repetitivos'); if(t.struct) no.push('entornos sin ningún orden ni planificación');
  return {top,H,Y,X,mot,forts,dev,obs,env,envPl,no,areas:[...areas].map(a=>AREA_N[a])};
}

function aiPrompt(rounds){

Resultado del test de la persona (JSON):
${JSON.stringify(aiPayload())}
`;
  rounds.forEach((r,i)=>{ s+=`\nRonda ${i+1}: le hiciste estas preguntas y respondió:\n`+r.qa.map(q=>`- ${q.q}\n  Respuesta: ${q.a||'(sin respuesta)'}`).join('\n')+'\n'; });

Devuelve SOLO un JSON con esta forma:
{"lectura":"2 o 3 párrafos breves con una lectura personal y honesta del perfil","hechos":["lo que la persona ha dicho"],"hipotesis":["lo que deduces"],"explorar":["lo que falta comprobar"],"caminos_extra":[{"nombre":"","porque":"","como_probarlo":"una prueba de 7 a 30 días sin dejar el empleo"}],"preguntas":["","",""]}
"caminos_extra": 2 o 3 caminos que probablemente no se ha planteado y que no estén en la lista caminos_del_test. "preguntas": exactamente 3 preguntas abiertas y concretas para afinar el perfil, adaptadas a lo que todavía no sabes${rounds.length?' y sin repetir las anteriores':''}.`;
  return s;

const AI_ERR={not_granted:'No has dado permiso para usar Claude. El resto del test funciona igual.',rate_limited:'Demasiadas peticiones seguidas. Espera un minuto y vuelve a intentarlo.',invalid_json:'La respuesta llegó incompleta. Vuelve a intentarlo.',cancelled:'Has detenido la entrevista.'};
async function runAI(refine){
  if(!sampleApi) return; const prev=S.ai||{rounds:[],res:null};
  const rounds=prev.rounds.slice();
  if(refine&&prev.res){ const qs=(prev.res.preguntas||[]).slice(0,3); rounds.push({qa:qs.map((q,i)=>({q:String(q),a:(document.getElementById('aiq-'+i)||{}).value||''}))}); }
  S.ai={status:'loading',rounds:prev.rounds,res:prev.res}; renderAI();
  aiCtl=new AbortController();
  try{ const res=await sampleApi.json(aiPrompt(rounds),{signal:aiCtl.signal,cache:false});
    if(!res||typeof res!=='object') throw {code:'invalid_json'};
    S.ai={status:'idle',rounds,res};
  }catch(e){ S.ai={status:'idle',rounds:prev.rounds,res:prev.res,error:AI_ERR[e&&e.code]||'No se pudo completar. Vuelve a intentarlo más tarde.'}; if(e&&e.code==='not_granted') sampleApi=null; }
  renderAI();
}

   `\n\n## Finalistas y pruebas\n`+fin.map(x=>`### ${x.p.n}\n- Qué hacer: ${x.p.test.hacer}\n- Inversión: ${x.p.test.dinero}\n- Seguir si: ${x.p.test.seguir}\n- Cambiar si: ${x.p.test.cambiar}`).join('\n\n')+
   `\n\n## Números\n- Beneficio neto necesario: ${eur(v.N)}/mes\n- Facturación aproximada: ${eur(v.F)}/mes\n- Colchón: ${eur(v.col)}\n`;
  if(S.ai&&S.ai.res&&S.ai.res.lectura) s+=`\n## Lectura con Claude\n${S.ai.res.lectura}\n`;
  return s;
}

/* ================= EVENTOS ================= */
app.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.q){ const q=SECTIONS[S.step].qs.find(q=>q.id===b.dataset.q), v=b.dataset.v;
    if(q.type==='multi'){ let arr=(S.answers[q.id]||[]).slice(); if(arr.includes(v)) arr=arr.filter(x=>x!==v); else { if(arr.length>=q.max) arr.shift(); arr.push(v);} S.answers[q.id]=arr;
      b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',arr.includes(x.dataset.v))); }
    else { S.answers[q.id]=v; b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v)); }
    save(); return; }
  if(b.dataset.tab){ S.tab=b.dataset.tab; render(); app.scrollIntoView({block:'start'}); return; }
  if(b.dataset.identity){ S.identity=b.dataset.identity; render(); return; }
  if(b.dataset.choose){ S.chosen=b.dataset.choose; render(); return; }
  const a=b.dataset.act;
  if(a==='start'){ if(S.example){S.answers={};S.example=false;} S.view='quiz'; render(); }
  if(a==='example'){ S.answers=JSON.parse(JSON.stringify(EXAMPLE)); S.example=true; S.identity='si'; S.view='results'; S.tab='perfil'; render(); }
  if(a==='reset'){ S.answers={}; S.step=0; S.identity=null; S.identityNote=''; S.example=false; S.checks={}; S.ai=null; S.tab='perfil'; S.view='intro'; save(); render(); window.scrollTo(0,0); }
  if(a==='edit'){ S.view='quiz'; S.step=0; S.example=false; render(); window.scrollTo(0,0); }
  if(a==='back'){ if(S.step===0) S.view='intro'; else S.step--; render(); window.scrollTo(0,0); }
  if(a==='next'){ const sec=SECTIONS[S.step], miss=sec.qs.filter(q=>!answered(q));
    if(miss.length){ const m=document.getElementById('missing'); m.hidden=false; m.textContent='Te falta responder: '+miss.map(q=>'«'+q.t+'»').join(', '); return; }
    if(S.step<SECTIONS.length-1) S.step++; else { S.view='results'; S.tab='perfil'; S.identity=null; }
    render(); window.scrollTo(0,0); }
  if(a==='ai') runAI(false);
  if(a==='ai-refine') runAI(true);
  if(a==='ai-stop') aiCtl&&aiCtl.abort();
  if(a==='copy'){ const txt=summaryText(), msg=document.getElementById('copy-msg'), fb=document.getElementById('fallback');
    try{ await navigator.clipboard.writeText(txt); msg.hidden=false; msg.textContent='Resumen copiado.'; fb.hidden=true; }
    catch(err){ fb.hidden=false; fb.value=txt; fb.focus(); fb.select(); msg.hidden=false; msg.textContent='Selecciona el texto y cópialo.'; } }
  if(a==='download'&&downloadsApi){ try{ await downloadsApi.save({filename:'brujula-vocacional.md',data:new Blob([summaryText()],{type:'text/markdown'})}); }catch(err){} }
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.text){ S.answers[t.dataset.text]=t.value; save(); }
  if(t.dataset.idnote!==undefined){ S.identityNote=t.value; save(); }
  if(t.dataset.calc){ const n=parseFloat(t.value); if(!isNaN(n)){ const lim={imp:95,gastosNeg:95}; S.calc[t.dataset.calc]=lim[t.dataset.calc]?Math.min(n,lim[t.dataset.calc]):n; save(); const o=document.getElementById('calc-out'); if(o) o.innerHTML=calcOut(calcVals()); } }
});
app.addEventListener('change',e=>{
  const t=e.target; if(t.dataset.check){ S.checks[t.dataset.check]=t.checked; save(); render(); }
});

render();
(async()=>{ if(!window.claude||!window.claude.use) return;
  try{ sampleApi=await window.claude.use('sample'); }catch(e){ sampleApi=null; }
  try{ downloadsApi=await window.claude.use('downloads'); }catch(e){ downloadsApi=null; }
  if(S.view==='results'){ renderAI(); const d=document.getElementById('dl-btn'); if(d&&downloadsApi) d.hidden=false; }
})();
</script>
